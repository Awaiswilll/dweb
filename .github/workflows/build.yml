name: Build, Release & Publish

on:
  push:
    branches: [main]
    tags: ['v*']           # v0.1.0, v0.2.0, etc. → triggers release
  pull_request:
    branches: [main]
  workflow_dispatch:        # manual trigger
    inputs:
      build_target:
        description: 'Build target'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - wsl-msix

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Lint & Check ──────────────────────────────────────────────────────────
  lint:
    if: inputs.build_target != 'wsl-msix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Linux deps (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Check formatting
        run: cargo fmt --check
        working-directory: src-tauri

      - name: Clippy
        run: cargo clippy -- -D warnings
        working-directory: src-tauri

      - name: TypeScript check
        run: npx tsc --noEmit

  # ── Build & Release (Windows x86_64) ─────────────────────────────────────
  build-windows:
    needs: lint
    runs-on: windows-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app (Windows)
        uses: tauri-apps/tauri-action@v1
        id: tauri_build_windows
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'dweb v__VERSION__'
          releaseBody: |
            ## dweb v__VERSION__

            ### 📥 Downloads
            - **Windows**: `dweb_x64-setup.exe` (NSIS installer)
            - **Windows portable**: `dweb_x64-portable.exe`
            - **macOS**: `dweb_x64.dmg`
            - **Linux**: `dweb_x64.deb` / `dweb_x64.AppImage`

            ### 🆕 What's New
            See the [CHANGELOG](./CHANGELOG.md) for details.

            ### 🔧 System Requirements
            - **Windows**: Windows 10+ (64-bit)
            - **macOS**: 10.15+
            - **Linux**: WebKit2GTK 4.1+
          releaseDraft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Also upload raw binary as artifact (portable, no installer)
      - name: Upload portable binary
        uses: actions/upload-artifact@v4
        with:
          name: dweb-windows-portable-x64
          path: src-tauri/target/release/dweb.exe
          if-no-files-found: warn

  # ── Build & Release (macOS) ──────────────────────────────────────────────
  build-macos:
    needs: lint
    runs-on: macos-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app (macOS)
        uses: tauri-apps/tauri-action@v1
        id: tauri_build_macos
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'dweb v__VERSION__'
          releaseBody: ''
          releaseDraft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || '' }}

      - name: Upload raw binary
        uses: actions/upload-artifact@v4
        with:
          name: dweb-macos-x64
          path: src-tauri/target/release/dweb
          if-no-files-found: warn

  # ── Build & Release (Linux) ──────────────────────────────────────────────
  build-linux:
    needs: lint
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux deps (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app (Linux)
        uses: tauri-apps/tauri-action@v1
        id: tauri_build_linux
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'dweb v__VERSION__'
          releaseBody: ''
          releaseDraft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload raw binary
        uses: actions/upload-artifact@v4
        with:
          name: dweb-linux-x64
          path: src-tauri/target/release/dweb
          if-no-files-found: warn

  # ── Quick CI-only build (PRs, no release) ────────────────────────────────
  ci-check:
    needs: lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux deps (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Rust (debug, quick)
        run: cargo build --verbose
        working-directory: src-tauri

      - name: Run Rust tests
        run: cargo test
        working-directory: src-tauri
  # ── Unsigned WSL MSIX (Store submission payload) ────────────────────────
  build-wsl-msix:
    if: inputs.build_target == 'wsl-msix'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Stage WSL MSIX payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = 'packaging/win32/dweb-wsl-distro'
          $stage = 'build/msix-stage'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "$src/Package.appxmanifest" "$stage/AppxManifest.xml"
          Copy-Item "$src/distro-config.xml" "$stage/distro-config.xml"
          Copy-Item -Recurse "$src/Assets" "$stage/Assets" -Force
          Copy-Item "$env:SystemRoot\System32\wsl.exe" "$stage\wsl.exe"
          Copy-Item 'packaging/wsl/dweb-wsl-rootfs.tar.gz' "$stage/dweb-wsl-rootfs.tar.gz"
          Copy-Item "$stage/dweb-wsl-rootfs.tar.gz" "$stage/dweb.wsl"
          Get-ChildItem -Recurse $stage | Select-Object FullName, Length

      - name: Pack unsigned MSIX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\MakeAppx.exe' -ErrorAction SilentlyContinue
          if (-not $candidates) { throw 'MakeAppx.exe not found in Windows SDK' }
          $makeappx = ($candidates | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          New-Item -ItemType Directory -Force -Path 'build/msix-out' | Out-Null
          & $makeappx pack /d 'build/msix-stage' /p 'build/msix-out/dweb-wsl_0.1.0_x64.msix' /l
          if ($LASTEXITCODE -ne 0) { throw "MakeAppx failed with exit code $LASTEXITCODE" }
          Get-Item 'build/msix-out/dweb-wsl_0.1.0_x64.msix' | Select-Object FullName, Length

      - name: Upload MSIX
        uses: actions/upload-artifact@v4
        with:
          name: dweb-wsl-msix-x64
          path: build/msix-out/*.msix
          if-no-files-found: error
